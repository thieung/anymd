name: Deploy (self-hosted)

# Fork-only workflow: deploys main to the private instance described in wrangler.self.jsonc.
# Upstream's deploy.yml is disabled in this fork's Actions settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-self
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository != 'digitopvn/anymd'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply anymd-self --remote -c wrangler.self.jsonc
      - name: Deploy Worker
        run: npx wrangler deploy -c wrangler.self.jsonc
      - name: Smoke test
        run: |
          host=$(node -e "const s=require('fs').readFileSync('wrangler.self.jsonc','utf8');console.log(s.match(/\"PUBLIC_URL\": \"([^\"]+)\"/)[1])")
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$host/") && [ "$code" = 200 ] && break
            sleep 5
          done
          [ "$code" = 200 ] || { echo "Home page returned $code"; exit 1; }
          curl -sf "$host/llms.txt" > /dev/null
          curl -sf "$host/api/v1/openapi.json" > /dev/null
          anon=$(curl -s -o /dev/null -w '%{http_code}' "$host/example.com")
          [ "$anon" = 401 ] || { echo "Anonymous convert returned $anon, expected 401"; exit 1; }
